version: '3.8'

services:
  db:
    image: docker.io/postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=your_strong_postgres_password
      - POSTGRES_DB=signator
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./Backend/api:/app/api # Für Live-Reload bei der Entwicklung
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=your_strong_postgres_password
      - POSTGRES_DB=signator
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./Frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_SERVER_URL=http://10.10.1.13:8000

volumes:
  postgres-data:
  minio-data: